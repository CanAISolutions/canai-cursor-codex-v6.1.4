<script type="text/javascript">
        var gk_isXlsx = false;
        var gk_xlsxFileLookup = {};
        var gk_fileData = {};
        function filledCell(cell) {
          return cell !== '' && cell != null;
        }
        function loadFileData(filename) {
        if (gk_isXlsx && gk_xlsxFileLookup[filename]) {
            try {
                var workbook = XLSX.read(gk_fileData[filename], { type: 'base64' });
                var firstSheetName = workbook.SheetNames[0];
                var worksheet = workbook.Sheets[firstSheetName];

                // Convert sheet to JSON to filter blank rows
                var jsonData = XLSX.utils.sheet_to_json(worksheet, { header: 1, blankrows: false, defval: '' });
                // Filter out blank rows (rows where all cells are empty, null, or undefined)
                var filteredData = jsonData.filter(row => row.some(filledCell));

                // Heuristic to find the header row by ignoring rows with fewer filled cells than the next row
                var headerRowIndex = filteredData.findIndex((row, index) =>
                  row.filter(filledCell).length >= filteredData[index + 1]?.filter(filledCell).length
                );
                // Fallback
                if (headerRowIndex === -1 || headerRowIndex > 25) {
                  headerRowIndex = 0;
                }

                // Convert filtered JSON back to CSV
                var csv = XLSX.utils.aoa_to_sheet(filteredData.slice(headerRowIndex)); // Create a new sheet from filtered array of arrays
                csv = XLSX.utils.sheet_to_csv(csv, { header: 1 });
                return csv;
            } catch (e) {
                console.error(e);
                return "";
            }
        }
        return gk_fileData[filename] || "";
        }

<body>
  <div class="sparksplit-container" role="main" aria-labelledby="sparksplit-title">
    <h1 id="sparksplit-title" class="visually-hidden">CanAI SparkSplit Comparison</h1>
    <div class="output-card" aria-labelledby="canai-heading">
      <h2 id="canai-heading">CanAI Output</h2>
      <pre id="canaiOutput" aria-live="polite">Loading...</pre>
      <div class="score-display">
        <div class="score-item">Awe Score: <span id="canaiAweScore" aria-live="polite">Loading...</span></div>
        <div class="score-item">Trust Score: <span id="trustScore" aria-live="polite">Loading...</span></div>
      </div>
    </div>
    <div class="output-card" aria-labelledby="sterile-heading">
      <h2 id="sterile-heading">Sterile Output</h2>
      <pre id="sterileOutput" aria-live="polite">Loading...</pre>
      <div class="score-display">
        <div class="score-item">Awe Score: <span id="sterileAweScore" aria-live="polite">0.3</span></div>
        <div class="score-item">Trust Score: <span id="sterileTrustScore" aria-live="polite">3.5</span></div>
      </div>
    </div>
    <form id="sparksplitForm" aria-describedby="form-instructions">
      <p id="form-instructions" class="visually-hidden">Select an output option and optionally provide feedback.</p>
      <fieldset>
        <legend class="visually-hidden">Select Output Preference</legend>
        <div class="radio-group">
          <label><input type="radio" name="selection" value="canai" required><span>CanAI</span></label>
          <label><input type="radio" name="selection" value="sterile"><span>Sterile</span></label>
          <label><input type="radio" name="selection" value="both"><span>Both</span></label>
          <label><input type="radio" name="selection" value="neither"><span>Neither</span></label>
          <label><input type="radio" name="selection" value="human"><span>Human</span></label>
          <label><input type="radio" name="selection" value="skip"><span>Skip</span></label>
        </div>
      </fieldset>
      <label for="feedback" class="visually-hidden">Feedback (optional)</label>
      <textarea id="feedback" placeholder="Your feedback (optional)" aria-describedby="feedback-instructions"></textarea>
      <p id="feedback-instructions" class="visually-hidden">Enter feedback about your selection.</p>
      <button type="submit" id="submitButton">Submit Choice</button>
      <p class="loading" id="loadingMessage" aria-live="assertive">Submitting...</p>
      <p class="error-message" id="errorMessage" aria-live="assertive"></p>
      <p class="success-message" id="successMessage" aria-live="assertive"></p>
    </form>

  <script defer>
    // Configuration - Updated for production with Webflow integration
    const config = {
      supabaseUrl: window.CANAI_CONFIG?.supabaseUrl || 'https://ezdpmpwnqnizbveamicd.supabase.co',
      supabaseServiceKey: window.CANAI_CONFIG?.serviceKey || '{{secrets.supabaseServiceKey}}',
      supabaseAnonKey: window.CANAI_CONFIG?.anonKey || '{{secrets.supabaseAnonKey}}',
      selectionWebhookUrl: window.CANAI_CONFIG?.selectionWebhookUrl || '{{secrets.selectionWebhookUrl}}',
      userId: window.CANAI_CONFIG?.userId || new URLSearchParams(window.location.search).get('user') || 'demo_user',
      sessionId: window.CANAI_CONFIG?.sessionId || new URLSearchParams(window.location.search).get('session') || 'demo_session'
    };

    // Utility to sanitize input
    function sanitizeInput(input) {
      const div = document.createElement('div');
      div.textContent = input;
      return div.innerHTML;
    }

    // Fetch outputs from Supabase - Updated with correct table and field names
    async function fetchOutputs(sessionId) {
      const outputElements = {
        canaiOutput: document.getElementById('canaiOutput'),
        sterileOutput: document.getElementById('sterileOutput'),
        canaiAweScore: document.getElementById('canaiAweScore'),
        trustScore: document.getElementById('trustScore')
      };
      
      outputElements.canaiOutput.textContent = 'Loading...';
      outputElements.sterileOutput.textContent = 'Loading...';
      outputElements.canaiAweScore.textContent = 'Loading...';
      outputElements.trustScore.textContent = 'Loading...';

      try {
        const response = await fetch(`${config.supabaseUrl}/rest/v1/sparksplit_comparisons?session_id=eq.${sessionId}&select=canai_output,sterile_output,canai_awe_score,trust_delta`, {
          headers: {
            'Authorization': `Bearer ${config.supabaseServiceKey}`,
            'apikey': config.supabaseAnonKey,
            'Content-Type': 'application/json'
          },
          cache: 'no-store'
        });
        
        if (!response.ok) throw new Error(`HTTP ${response.status}: ${response.statusText}`);
        
        const data = await response.json();
        if (data && data.length > 0) {
          const comparison = data[0];
          outputElements.canaiOutput.textContent = typeof comparison.canai_output === 'string' 
            ? comparison.canai_output 
            : JSON.stringify(comparison.canai_output, null, 2);
          outputElements.sterileOutput.textContent = typeof comparison.sterile_output === 'string' 
            ? comparison.sterile_output 
            : JSON.stringify(comparison.sterile_output, null, 2);
          outputElements.canaiAweScore.textContent = comparison.canai_awe_score?.toFixed(2) || 'N/A';
          outputElements.trustScore.textContent = (4.2 + (comparison.trust_delta || 0)).toFixed(2);
        } else {
          throw new Error('No comparison data found for this session');
        }
      } catch (error) {
        console.error('Fetch error:', error);
        outputElements.canaiOutput.textContent = 'Error loading output. Please refresh the page.';
        outputElements.sterileOutput.textContent = 'Error loading output. Please refresh the page.';
        outputElements.canaiAweScore.textContent = 'N/A';
        outputElements.trustScore.textContent = 'N/A';
        
        // Show error message to user
        const errorMessage = document.getElementById('errorMessage');
        errorMessage.textContent = 'Failed to load comparison data. Please refresh the page or contact support.';
        errorMessage.style.display = 'block';
      }
    }

    // Handle form submission - Updated with correct webhook integration
    document.getElementById('sparksplitForm').addEventListener('submit', async (e) => {
      e.preventDefault();
      
      const submitButton = document.getElementById('submitButton');
      const loadingMessage = document.getElementById('loadingMessage');
      const errorMessage = document.getElementById('errorMessage');
      const successMessage = document.getElementById('successMessage');

      // Reset UI state
      submitButton.disabled = true;
      loadingMessage.style.display = 'block';
      errorMessage.style.display = 'none';
      successMessage.style.display = 'none';

      const selectionElement = document.querySelector('input[name="selection"]:checked');
      if (!selectionElement) {
        loadingMessage.style.display = 'none';
        errorMessage.textContent = 'Please select an output option.';
        errorMessage.style.display = 'block';
        submitButton.disabled = false;
        return;
      }

      const selection = selectionElement.value;
      const feedbackText = document.getElementById('feedback').value.trim();
      
      let feedback = {};
      if (feedbackText) {
        try {
          // Try to parse as JSON first, fallback to plain text
          feedback = JSON.parse(feedbackText);
        } catch {
          feedback = { comment: sanitizeInput(feedbackText) };
        }
      }

      try {
        // Submit to Make.com webhook (Webhook 4: SparkSplit Selection Handler)
        const response = await fetch(config.selectionWebhookUrl, {
          method: 'POST',
          headers: {
            'Content-Type': 'application/json'
          },
          body: JSON.stringify({
            userId: config.userId,
            sessionId: config.sessionId,
            userSelection: selection,
            feedback: feedback,
            timestamp: new Date().toISOString(),
            timeToSelection: performance.now(), // Time since page load
            userAgent: navigator.userAgent
          })
        });
        
        if (!response.ok) {
          throw new Error(`HTTP ${response.status}: ${response.statusText}`);
        }
        
        loadingMessage.style.display = 'none';
        successMessage.textContent = 'Thank you! Your selection has been recorded successfully.';
        successMessage.style.display = 'block';
        
        // Reset form
        document.getElementById('sparksplitForm').reset();
        
        // Optional: Redirect after success
        setTimeout(() => {
          if (window.CANAI_CONFIG?.redirectUrl) {
            window.location.href = window.CANAI_CONFIG.redirectUrl;
          }
        }, 2000);
        
      } catch (error) {
        console.error('Submission error:', error);
        loadingMessage.style.display = 'none';
        errorMessage.textContent = 'Failed to submit your selection. Please try again or contact support.';
        errorMessage.style.display = 'block';
      } finally {
        submitButton.disabled = false;
      }
    });

    // Initialize - Load outputs when page loads
    document.addEventListener('DOMContentLoaded', () => {
      if (config.sessionId && config.sessionId !== 'demo_session') {
        fetchOutputs(config.sessionId);
      } else {
        console.warn('No valid session ID found. Using demo mode.');
        document.getElementById('errorMessage').textContent = 'Demo mode: No live session data available.';
        document.getElementById('errorMessage').style.display = 'block';
      }
    });

    // Accessibility: Enhanced keyboard navigation
    document.querySelectorAll('input[type="radio"]').forEach(radio => {
      radio.addEventListener('keydown', (e) => {
        if (e.key === 'Enter' || e.key === ' ') {
          e.preventDefault();
          radio.checked = true;
          radio.dispatchEvent(new Event('change'));
        }
      });
    });

    // Enhanced error recovery
    window.addEventListener('error', (e) => {
      console.error('Global error:', e.error);
      const errorMessage = document.getElementById('errorMessage');
      if (errorMessage && !errorMessage.style.display) {
        errorMessage.textContent = 'An unexpected error occurred. Please refresh the page.';
        errorMessage.style.display = 'block';
      }
    });

    // Performance monitoring
    if ('performance' in window) {
      window.addEventListener('load', () => {
        const loadTime = performance.now();
        console.log(`SparkSplit UX loaded in ${loadTime.toFixed(2)}ms`);
      });
    }
  </script>
