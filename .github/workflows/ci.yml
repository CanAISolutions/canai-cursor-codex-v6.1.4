name: CanAI Codex CI Pipeline

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: '0 3 * * 0' # Weekly: Sundays @ 3AM UTC

jobs:
  codex-test-suite:
    name: 🧠 Run QA Fortress + Codex Enforcement
    runs-on: ubuntu-latest
    continue-on-error: false

    steps:
      - name: 🧾 Checkout Codebase
        uses: actions/checkout@v3

      - name: ⚙️ Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: 18

      - name: 📦 Install Dependencies
        run: npm install

      - name: ✅ Lint Codebase
        run: npm run lint

      - name: 🔐 Run QA Fortress (`test:all`)
        run: npm run test:all

      - name: 🔁 Prompt Diff Safety (Unpromoted Changes Blocked)
        run: |
          echo "🔍 Checking for unauthorized .prompt changes..."
          if git diff --name-only origin/main | grep '\.prompt' && ! git log -1 --pretty=%B | grep -qi "promote"; then
            echo "❌ PROMPT MODIFIED WITHOUT PROMOTION — BLOCKING"
            exit 1
          fi
          echo "✅ Prompt diff integrity passed."

      - name: 🧠 Validate Prompt Structure + Versioning
        run: |
          echo "🔎 Validating prompt files..."
          if grep -q "// Sample content" prompts/*.ts; then
            echo "❌ Detected stub prompt — block"
            exit 1
          fi
          if ! ls prompt-versions/*.prompt >/dev/null 2>&1; then
            echo "❌ No versioned prompts found"
            exit 1
          fi
          echo "✅ Prompt structure + versioning validated."

      - name: 📏 Cursor Rules Compliance
        run: |
          echo "📋 Checking for Cursor compliance..."
          if grep -r "TODO" prompts/ gpt-templates/; then
            echo "❌ Found TODOs — block deploy"
            exit 1
          fi
          echo "✅ All prompt files Cursor compliant."

      - name: 🧪 Test File Coverage Minimum (QA Fortress Check)
        run: |
          echo "🧮 Counting /tests files..."
          FILE_COUNT=$(ls tests/*.ts | wc -l)
          if [ "$FILE_COUNT" -lt 50 ]; then
            echo "❌ Insufficient test coverage — expected 50+, found $FILE_COUNT"
            exit 1
          fi
          echo "✅ Test suite coverage is complete: $FILE_COUNT files found."

      - name: 🔐 Promotion Log Update Enforced
        run: |
          echo "🧾 Checking promotion-log presence for prompt changes..."
          if git diff --name-only origin/main | grep '\.prompt' && ! git diff --name-only | grep 'promotion-log'; then
            echo "❌ Prompt edited without promotion-log update"
            exit 1
          fi
          echo "✅ Promotion log presence validated."

      - name: 🧯 Detect Placeholder Tokens, Keys, and Secrets
        run: |
          echo "🧪 Scanning for placeholder secrets or API keys..."
          if grep -r -E "your-api-key|your-secret|hook.us1.make.com/xxxxx|tpl_XXXXX|demo@example.com|test@canai.so|your-render-url|STRIPE_PUBLISHABLE_KEY=pk_test_" .env.* scripts/ components/ prompts/ automations/ gpt-templates/; then
            echo "❌ Placeholder token or key detected — block deploy"
            exit 1
          fi
          echo "✅ No placeholder tokens or secrets found."

      - name: 🛡️ Checkpoint Directive — Codex Enforcement
        run: |
          echo ""
          echo "────────────────────────────────────────────────────────────"
          echo "🛡️  Checkpoint Directive: Codex Enforcement & Dream-State Alignment"
          echo ""
          echo "✅ Does this enhance clarity, intelligence, resilience, or trust?"
          echo "✅ Does this prevent regression, UX decay, or technical debt?"
          echo ""
          echo "If NO to either — deployment MUST be blocked."
          echo ""
          echo "We do not build fast. We build forever."
          echo "We do not trim quality. We compound it."
          echo "We do not miss the mark. We redefine it."
          echo "────────────────────────────────────────────────────────────"
