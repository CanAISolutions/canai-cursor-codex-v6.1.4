# .github/workflows/codex-qa.yml
name: 🧪 Codex QA Check

on:
  push:
    paths:
      - 'test-data/**'
      - '.github/workflows/codex-qa.yml'
  pull_request:
    paths:
      - 'test-data/**'

jobs:
  codex-qa:
    runs-on: ubuntu-latest
    name: Run Codex QA Test Suite

    steps:
      - name: ⬇️ Checkout repo
        uses: actions/checkout@v3

      - name: 🟢 Setup Node
        uses: actions/setup-node@v3
        with:
          node-version: '18'

      - name: 📦 Install deps (if needed)
        run: npm ci || true

      - name: 🧪 Run Codex Test Suite
        run: |
          npx ts-node test-data/_tests/test-input-shape-field.ts
          npx ts-node test-data/_tests/test-prompt-type-coverage.ts
          npx ts-node test-data/_tests/test-codex-header-comments.ts
          npx ts-node test-data/_tests/test-snapshot-consistency.ts
          npx ts-node test-data/_tests/test-output-delta-drift.ts
