name: Cursor Ingest Drift Check

on:
  push:
    paths:
      - 'cursor/self-awareness.json'
      - 'cursor/cursor-ingest.md'
      - 'docs/system-map.md'
      - 'tests/**'
  pull_request:
    paths:
      - 'cursor/self-awareness.json'
      - 'cursor/cursor-ingest.md'
      - 'docs/system-map.md'
      - 'tests/**'

jobs:
  drift-check:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '18'

      - name: Install dependencies
        run: npm ci

      - name: Run ingest drift test
        run: npm run test -- tests/cursor/ingest-drift-check.test.ts
