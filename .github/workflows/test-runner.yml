# .github/workflows/test-runner.yml
name: Run Codex Tests

on:
  push:
    branches:
      - main
      - preboot
  pull_request:
    branches:
      - "*"

jobs:
  test:
    name: Run Claude Context & System Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v3

      - name: Set up Node
        uses: actions/setup-node@v3
        with:
          node-version: 18

      - name: Install Dependencies
        run: npm install

      - name: Run Tests
        run: npx jest tests/system/claude-context.test.ts --ci
