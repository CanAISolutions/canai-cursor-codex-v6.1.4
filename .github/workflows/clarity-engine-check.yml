name: Clarity Engine Check

on:
  pull_request:
    paths:
      - 'prompts/**'
      - 'gpt-templates/**'
      - 'prompt-versions/**'
      - 'phantom-prompts/**'
      - 'red-team/**'
      - 'simulation-engine/**'
      - 'cursor/auto-actions.log.md'

jobs:
  clarity-audit:
    runs-on: ubuntu-latest
    
    steps:
      - uses: actions/checkout@v3
      
      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '18'
          cache: 'pnpm'
          
      - name: Install pnpm
        uses: pnpm/action-setup@v2
        with:
          version: 8
          
      - name: Install dependencies
        run: pnpm install
        
      - name: Run Clarity Engine Audit
        run: pnpm run clarity-audit
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          
      - name: Upload Audit Artifacts
        if: always()
        uses: actions/upload-artifact@v3
        with:
          name: clarity-engine-artifacts
          path: |
            prompt-evolution-map.json
            clarity-engine-dashboard.json
            input-coaching-report.md
          retention-days: 7
          
      - name: Check Critical Thresholds
        if: failure()
        run: |
          echo "Critical validation failures detected. Please review the audit artifacts."
          exit 1
          
      - name: Comment PR with Results
        if: always()
        uses: actions/github-script@v6
        with:
          script: |
            const fs = require('fs');
            const dashboard = JSON.parse(fs.readFileSync('clarity-engine-dashboard.json', 'utf8'));
            
            const critical = dashboard.results.filter(r => r.severity === 'Critical');
            const highImpact = dashboard.results.filter(r => r.severity === 'High-Impact');
            
            const message = `
            ## Clarity Engine Audit Results
            
            ### Critical Issues (${critical.length})
            ${critical.map(r => `- ${r.message}`).join('\n')}
            
            ### High-Impact Issues (${highImpact.length})
            ${highImpact.map(r => `- ${r.message}`).join('\n')}
            
            ### System Health
            - Trust Score: ${dashboard.trustScore}
            - Memory Fidelity: ${dashboard.memoryFidelity}%
            - Emotional Resonance: ${dashboard.emotionalResonance}
            
            Full audit results available in the workflow artifacts.
            `;
            
            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: message
            }); 

  red-team:
    name: Red Team Check
    runs-on: ubuntu-latest
    needs: clarity-audit
    steps:
      - name: Checkout repository
        uses: actions/checkout@v3
      - name: Set up Node.js
        uses: actions/setup-node@v3
        with:
          node-version: 18
          cache: 'pnpm'
      - name: Install pnpm
        run: npm install -g pnpm@8
      - name: Install dependencies
        run: pnpm install
      - name: Run Red Team Tests
        run: pnpm run red-team
      - name: Check Red Team Thresholds
        run: |
          summary=red-team/reports/latest-summary.md
          if grep -q 'Hallucination Issues: [^0]' "$summary" || \
             grep -q 'Injection Issues: [^0]' "$summary" || \
             grep -q 'Fallback Issues: [^0]' "$summary"; then
            echo "::error::Red Team check failed: Unsafe scores detected."
            exit 1
          fi
      - name: Upload Red Team Summary
        uses: actions/upload-artifact@v3
        with:
          name: red-team-latest-summary
          path: red-team/reports/latest-summary.md
          retention-days: 7

  validate-log-updates:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v2

      - name: Validate Log Updates
        run: |
          if git diff --name-only ${{ github.event.pull_request.base.sha }} ${{ github.event.pull_request.head.sha }} | grep -q 'simulation-engine/'; then
            if ! git diff --name-only ${{ github.event.pull_request.base.sha }} ${{ github.event.pull_request.head.sha }} | grep -q 'cursor/auto-actions.log.md'; then
              echo "❌ CI FAILED: Simulation update detected but no log entry found. Please update auto-actions.log.md per Clarity Logging Protocol."
              exit 1
            fi
          fi 