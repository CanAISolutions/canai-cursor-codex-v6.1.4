name: Dreamstate Enforcement
on:
  push:
    branches: ['preboot']
  pull_request:
    branches: ['preboot']

jobs:
  enforce-dreamstate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '16'
      - name: Install Dependencies
        run: npm install
      - name: Run Dreamstate Checks
        run: |
          npm run dreamstate-hash
          npm run sentinel:check
          npm run community:align
      - name: Verify Hash
        run: node cursor/scripts/hash-dreamstate.ts
