<!-- Discovery Funnel Embed -->
<div class="discovery-funnel-embed" data-version="6.1.4">
  <!-- Modal Trigger -->
  <button class="funnel-trigger" onclick="openDiscoveryFunnel()">
    Start with a Spark
  </button>

  <!-- Modal Container -->
  <div id="discoveryFunnelModal" class="funnel-modal" style="display: none;">
    <div class="funnel-content">
      <button class="close-button" onclick="closeDiscoveryFunnel()">×</button>
      
      <form id="discoveryFunnelForm" onsubmit="handleFunnelSubmit(event)">
        <!-- Intent Field -->
        <div class="form-field">
          <label for="intent">What's your challenge?</label>
          <textarea 
            id="intent" 
            name="intent" 
            required 
            minlength="10"
            onchange="trackIntentCapture(this.value)"
            onblur="validateField(this)"
          ></textarea>
          <div class="field-feedback"></div>
        </div>

        <!-- Tone Field -->
        <div class="form-field">
          <label for="tone">Choose your tone</label>
          <select 
            id="tone" 
            name="tone" 
            required
            onchange="trackIntentCapture(this.value)"
            onblur="validateField(this)"
          >
            <option value="">Select a tone...</option>
            <option value="playful">Playful & Creative</option>
            <option value="bold">Bold & Confident</option>
            <option value="calm">Calm & Professional</option>
            <option value="luxury">Luxury & Premium</option>
          </select>
          <div class="field-feedback"></div>
        </div>

        <!-- Industry Field -->
        <div class="form-field">
          <label for="industry">What's your industry?</label>
          <select 
            id="industry" 
            name="industry"
            onchange="trackIntentCapture(this.value)"
            onblur="validateField(this)"
          >
            <option value="">Select an industry...</option>
            <option value="coffee">Coffee & Beverages</option>
            <option value="bakery">Bakery & Food</option>
            <option value="fitness">Fitness & Wellness</option>
            <option value="consulting">Consulting & Services</option>
            <option value="saas">SaaS & Technology</option>
          </select>
          <div class="field-feedback"></div>
        </div>

        <!-- Optional Pain Point -->
        <div class="form-field">
          <label for="pain_point">What's your biggest challenge? (Optional)</label>
          <textarea 
            id="pain_point" 
            name="pain_point"
            onchange="trackIntentCapture(this.value)"
            onblur="validateField(this)"
          ></textarea>
          <div class="field-feedback"></div>
        </div>

        <!-- Hidden Fields -->
        <input type="hidden" id="sessionId" name="sessionId">
        <input type="hidden" id="preferredTone" name="preferredTone">
        <input type="hidden" id="timestamp" name="timestamp">
        <input type="hidden" id="dwellTime" name="dwellTime">
        <input type="hidden" id="fieldInteractions" name="fieldInteractions">

        <!-- Submit Button -->
        <button type="submit" class="submit-button">
          <span class="button-text">Get My Spark Ideas</span>
          <span class="loading-spinner" style="display: none;">
            <svg class="spinner" viewBox="0 0 50 50">
              <circle class="path" cx="25" cy="25" r="20" fill="none" stroke-width="5"></circle>
            </svg>
          </span>
        </button>
      </form>

      <!-- Success Message -->
      <div id="successMessage" class="message success" style="display: none;">
        <h3>Thank You!</h3>
        <p>Your spark ideas are being generated. We'll send them to your email shortly.</p>
      </div>

      <!-- Error Message -->
      <div id="errorMessage" class="message error" style="display: none;">
        <h3>Oops!</h3>
        <p>Something went wrong. Please try again or contact support.</p>
      </div>
    </div>
  </div>
</div>

<script>
// Analytics Events
const emitAnalytics = (event, data) => {
  if (window.analytics) {
    window.analytics.track(event, {
      ...data,
      timestamp: new Date().toISOString()
    });
  }
};

// Field Validation
const validateField = (field) => {
  const feedback = field.parentElement.querySelector('.field-feedback');
  let isValid = true;
  let message = '';

  if (field.required && !field.value) {
    isValid = false;
    message = 'This field is required';
  } else if (field.minLength && field.value.length < field.minLength) {
    isValid = false;
    message = `Minimum ${field.minLength} characters required`;
  }

  field.classList.toggle('invalid', !isValid);
  feedback.textContent = message;
  feedback.style.display = isValid ? 'none' : 'block';

  return isValid;
};

// Form Validation
const validateForm = (form) => {
  const fields = form.querySelectorAll('input[required], select[required], textarea[required]');
  let isValid = true;

  fields.forEach(field => {
    if (!validateField(field)) {
      isValid = false;
    }
  });

  return isValid;
};

// Modal Controls
const openDiscoveryFunnel = () => {
  const modal = document.getElementById('discoveryFunnelModal');
  modal.style.display = 'flex';
  emitAnalytics('funnelStarted');
  
  // Set hidden fields
  document.getElementById('sessionId').value = getSessionId();
  document.getElementById('preferredTone').value = getPreferredTone();
  document.getElementById('timestamp').value = new Date().toISOString();
  document.getElementById('dwellTime').value = '0';
  document.getElementById('fieldInteractions').value = '0';

  // Start dwell time tracking
  startDwellTimeTracking();
};

const closeDiscoveryFunnel = () => {
  const modal = document.getElementById('discoveryFunnelModal');
  modal.style.display = 'none';
  emitAnalytics('funnelClosed', {
    dwellTime: document.getElementById('dwellTime').value,
    fieldInteractions: document.getElementById('fieldInteractions').value
  });
};

// Form Handling
const handleFunnelSubmit = async (event) => {
  event.preventDefault();
  
  if (!validateForm(event.target)) {
    emitAnalytics('formValidationFailed');
    return;
  }

  const submitButton = event.target.querySelector('.submit-button');
  const buttonText = submitButton.querySelector('.button-text');
  const loadingSpinner = submitButton.querySelector('.loading-spinner');

  try {
    // Show loading state
    buttonText.style.display = 'none';
    loadingSpinner.style.display = 'block';
    submitButton.disabled = true;

    const form = event.target;
    const formData = new FormData(form);
    const data = Object.fromEntries(formData.entries());
    
    emitAnalytics('sparkRequested', {
      ...data,
      dwellTime: document.getElementById('dwellTime').value,
      fieldInteractions: document.getElementById('fieldInteractions').value
    });
    
    const response = await fetch('https://hook.us1.make.com/test-canaiso', {
      method: 'POST',
      headers: {
        'Content-Type': 'application/json'
      },
      body: JSON.stringify(data)
    });
    
    if (!response.ok) throw new Error('Submission failed');
    
    // Handle success
    showSuccessMessage();
    emitAnalytics('sparkRequestedSuccess');
    
  } catch (error) {
    console.error('Form submission error:', error);
    showErrorMessage();
    emitAnalytics('sparkRequestedError', { error: error.message });
  } finally {
    // Reset button state
    buttonText.style.display = 'block';
    loadingSpinner.style.display = 'none';
    submitButton.disabled = false;
  }
};

// Intent Tracking
const trackIntentCapture = (value) => {
  if (value.length > 10) {
    emitAnalytics('intentCaptured', { value });
    incrementFieldInteractions();
  }
};

// Dwell Time Tracking
let dwellTimeInterval;
const startDwellTimeTracking = () => {
  const startTime = Date.now();
  dwellTimeInterval = setInterval(() => {
    const dwellTime = Math.floor((Date.now() - startTime) / 1000);
    document.getElementById('dwellTime').value = dwellTime;
  }, 1000);
};

const incrementFieldInteractions = () => {
  const interactions = parseInt(document.getElementById('fieldInteractions').value) + 1;
  document.getElementById('fieldInteractions').value = interactions;
};

// Helper Functions
const getSessionId = () => {
  // Try Memberstack first
  if (window.MemberStack) {
    return window.MemberStack.getSessionId();
  }
  // Fallback to localStorage
  return localStorage.getItem('sessionId') || `session-${Date.now()}`;
};

const getPreferredTone = () => {
  if (window.MemberStack) {
    return window.MemberStack.getUserField('preferredTone');
  }
  return '';
};

// UI Feedback
const showSuccessMessage = () => {
  const form = document.getElementById('discoveryFunnelForm');
  const successMessage = document.getElementById('successMessage');
  
  form.style.display = 'none';
  successMessage.style.display = 'block';
  
  // Close modal after 3 seconds
  setTimeout(closeDiscoveryFunnel, 3000);
};

const showErrorMessage = () => {
  const errorMessage = document.getElementById('errorMessage');
  errorMessage.style.display = 'block';
  
  // Hide error after 5 seconds
  setTimeout(() => {
    errorMessage.style.display = 'none';
  }, 5000);
};

// Initialize
document.addEventListener('DOMContentLoaded', () => {
  // Set up any initial state
});
</script>

<style>

  position: fixed;
  top: 0;
  left: 0;

  align-items: center;
  justify-content: center;
  z-index: 1000;
}

  position: absolute;
  top: 1rem;

  background: none;

  font-size: 1.5rem;

}

  margin-bottom: 1.5rem;
}

  display: block;

}

  }

</style>
