<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CanAI - Empowerment Through Ease</title>
    
    <!-- CanAI Brand Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@200;400;700&family=Inter:wght@300;400;500&display=swap" rel="stylesheet">
    
    <!-- CanAI Brand Variables -->
    <link rel="stylesheet" href="../variables.css">
    
    <style>
        body {
            margin: 0;
            padding: 0;
            background: var(--canai-deep-background);
            color: var(--canai-light-text);
            font-family: var(--font-family-primary);
            overflow-x: hidden;
        }

        .canai-hero {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            position: relative;
            background: radial-gradient(circle at center, rgba(0, 207, 255, 0.1) 0%, var(--canai-deep-background) 70%);
        }

        .canai-logo-container {
            text-align: center;
            z-index: 10;
            position: relative;
        }

        .canai-logo {
            font-size: 4rem;
            font-weight: var(--font-weight-bold);
            letter-spacing: var(--letter-spacing-logo);
            background: var(--canai-gradient-primary);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            text-shadow: var(--text-shadow-glow);
            margin-bottom: 0.5rem;
        }

        .canai-domain-so {
            background: var(--canai-gradient-primary);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }

        .canai-tagline {
            font-size: 1.8rem;
            font-weight: var(--font-weight-extralight);
            letter-spacing: var(--letter-spacing-tagline);
            color: var(--canai-light-text);
            margin-top: 1rem;
            opacity: 0.9;
        }

        .canai-cube {
            position: absolute;
            width: var(--cube-size);
            height: var(--cube-size);
            perspective: var(--cube-perspective);
            transform: rotateX(var(--cube-rotation-x)) rotateY(var(--cube-rotation-y));
            z-index: 1;
        }

        .cube-face {
            position: absolute;
            width: 100%;
            height: 100%;
            background: var(--canai-gradient-cube);
            border: 2px solid var(--canai-primary-blue);
            box-shadow: var(--glow-cube);
            opacity: 0.8;
        }

        .cube-front { transform: translateZ(100px); }
        .cube-back { transform: rotateY(180deg) translateZ(100px); }
        .cube-right { transform: rotateY(90deg) translateZ(100px); }
        .cube-left { transform: rotateY(-90deg) translateZ(100px); }
        .cube-top { transform: rotateX(90deg) translateZ(100px); }
        .cube-bottom { transform: rotateX(-90deg) translateZ(100px); }

        .services-orbit {
            position: absolute;
            width: 400px;
            height: 400px;
            border: 1px solid rgba(0, 207, 255, 0.2);
            border-radius: 50%;
            animation: orbit 30s linear infinite;
        }

        .service-icon {
            position: absolute;
            width: 40px;
            height: 40px;
            background: var(--canai-primary-blue);
            border-radius: 50%;
            box-shadow: var(--glow-soft);
            display: flex;
            align-items: center;
            justify-content: center;
            color: var(--canai-deep-background);
            font-weight: bold;
            font-size: 0.8rem;
        }

        .service-icon:nth-child(1) { top: -20px; left: 50%; transform: translateX(-50%); }
        .service-icon:nth-child(2) { top: 50%; right: -20px; transform: translateY(-50%); }
        .service-icon:nth-child(3) { bottom: -20px; left: 50%; transform: translateX(-50%); }
        .service-icon:nth-child(4) { top: 50%; left: -20px; transform: translateY(-50%); }
        .service-icon:nth-child(5) { top: 15%; right: 15%; }
        .service-icon:nth-child(6) { bottom: 15%; right: 15%; }
        .service-icon:nth-child(7) { bottom: 15%; left: 15%; }

        @keyframes orbit {
            from { transform: rotate(0deg); }
            to { transform: rotate(360deg); }
        }

        .canai-content {
            max-width: 800px;
            margin: 4rem auto;
            padding: 0 2rem;
            text-align: center;
        }

        .canai-promise {
            font-size: 1.2rem;
            line-height: 1.6;
            color: var(--text-secondary);
            margin-bottom: 2rem;
        }

        .canai-cta {
            display: inline-block;
            padding: 1rem 2rem;
            background: var(--canai-gradient-primary);
            color: var(--canai-deep-background);
            text-decoration: none;
            border-radius: 8px;
            font-weight: 600;
            box-shadow: var(--glow-intensity);
            transition: all 0.3s ease;
        }

        .canai-cta:hover {
            transform: translateY(-2px);
            box-shadow: var(--glow-cube);
        }

        @media (max-width: 768px) {
            .canai-logo { font-size: 2.5rem; }
            .canai-tagline { font-size: 1.2rem; }
            .canai-cube { width: 150px; height: 150px; }
            .services-orbit { width: 300px; height: 300px; }
        }
    </style>
</head>
<body>
    <div class="canai-hero">
        <!-- Central Cube Motif -->
        <div class="canai-cube">
            <div class="cube-face cube-front"></div>
            <div class="cube-face cube-back"></div>
            <div class="cube-face cube-right"></div>
            <div class="cube-face cube-left"></div>
            <div class="cube-face cube-top"></div>
            <div class="cube-face cube-bottom"></div>
        </div>

        <!-- Orbiting Services -->
        <div class="services-orbit">
            <div class="service-icon" title="Business Plan">BP</div>
            <div class="service-icon" title="Social Campaign">SC</div>
            <div class="service-icon" title="Email Campaign">EC</div>
            <div class="service-icon" title="AI Brand Identity">AI</div>
            <div class="service-icon" title="Website Audit">WA</div>
            <div class="service-icon" title="Reverse Strategy">RS</div>
            <div class="service-icon" title="AI Brand Protection">BP</div>
        </div>

        <!-- Logo and Tagline -->
        <div class="canai-logo-container">
            <h1 class="canai-logo">
                CanAI<span class="canai-domain-so">.so</span>
            </h1>
            <p class="canai-tagline">Empowerment Through Ease</p>
        </div>
    </div>

    <div class="canai-content">
        <p class="canai-promise">
            Emotionally intelligent, zero-manual-touch strategy engine for small businesses
        </p>
        
        <a href="#" class="canai-cta">Experience CanAI</a>
    </div>

    <script>
        // Add subtle animation to cube
        const cube = document.querySelector('.canai-cube');
        let rotation = 0;
        
        function animateCube() {
            rotation += 0.5;
            cube.style.transform = `rotateX(${15 + Math.sin(rotation * 0.01) * 5}deg) rotateY(${25 + rotation * 0.1}deg)`;
            requestAnimationFrame(animateCube);
        }
        
        animateCube();
    </script>
</body>
</html>
